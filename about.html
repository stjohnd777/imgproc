<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
    <title>About Orbital Eyes</title>
    <style>
        body { margin: 0; padding: 22px 26px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1a30; color: #e3ebf8; }
        header { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
        header img { width: 84px; height: 84px; }
        h1 { margin: 0; font-size: 22px; }
        .muted { opacity: 0.7; }
        table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; }
        td { padding: 3px 6px; vertical-align: top; }
        td:first-child { opacity: 0.7; width: 130px; white-space: nowrap; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.75; margin: 14px 0 4px; }
        .tools { columns: 2; font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin: 0; padding-left: 18px; }
        .ok { color: #6fdc8c; } .bad { color: #ff7b7b; }
        code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="">
        <div>
            <h1>Orbital Eyes</h1>
            <div class="muted">Synthetic spacecraft imagery &amp; visual navigation workbench</div>
            <div id="version" class="muted"></div>
        </div>
    </header>
    <table id="facts"></table>
    <h2>External tools</h2>
    <table id="external"></table>
    <h2 id="toolsTitle">Native tools</h2>
    <ul id="tools" class="tools"></ul>
    <script src="about.js"></script>
</body>
</html>
