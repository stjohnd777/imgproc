<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' file:">
    <title>Orbital Eyes Help</title>
    <style>
        body { margin: 0; font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f9fc; color: #1d2633; }
        nav { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 18px; background: #0f1a30; color: #e3ebf8; }
        nav img { width: 26px; height: 26px; }
        nav button { background: #24365c; color: inherit; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
        nav button:disabled { opacity: 0.4; cursor: default; }
        nav .path { margin-left: auto; opacity: 0.7; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
        main { max-width: 860px; margin: 0 auto; padding: 18px 28px 40px; }
        h1, h2, h3 { line-height: 1.25; } h1 { font-size: 26px; } h2 { font-size: 19px; margin-top: 26px; border-bottom: 1px solid #dde3ec; padding-bottom: 4px; }
        code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #e9eef6; padding: 1px 4px; border-radius: 4px; }
        pre { background: #0f1a30; color: #e3ebf8; padding: 12px 14px; border-radius: 8px; overflow: auto; }
        pre code { background: none; padding: 0; color: inherit; }
        a { color: #1c5fd1; }
        table { border-collapse: collapse; } td, th { border: 1px solid #dde3ec; padding: 4px 8px; }
    </style>
</head>
<body>
    <nav>
        <img src="assets/logo.svg" alt="">
        <button id="back" disabled>◀ Back</button>
        <button id="home">Help home</button>
        <span id="path" class="path"></span>
    </nav>
    <main id="doc"></main>
    <script type="module" src="help.js"></script>
</body>
</html>
