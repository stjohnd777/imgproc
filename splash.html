<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
    <title>Orbital Eyes</title>
    <style>
        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
        body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .card {
            width: 400px; height: 280px; border-radius: 22px; box-sizing: border-box; padding: 24px;
            background: radial-gradient(circle at 50% 30%, #1d3a6e, #0b1530 70%);
            color: #e8f0ff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); border: 1px solid rgba(127, 196, 255, 0.25);
        }
        img { width: 132px; height: 132px; animation: bob 2.4s ease-in-out infinite; }
        h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: 0.5px; }
        .tag { font-size: 12px; opacity: 0.75; }
        .beta { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f2a93b; color: #2a1a03; font-weight: 700; margin-left: 6px; vertical-align: middle; }
        .bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; margin-top: 6px; }
        .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #7fc4ff; animation: slide 1.1s ease-in-out infinite; }
        @keyframes bob { 50% { transform: translateY(-6px); } }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
</head>
<body>
    <div class="card">
        <img src="assets/logo.svg" alt="">
        <h1>Orbital Eyes <span class="beta">BETA</span></h1>
        <div class="tag">Synthetic imagery &amp; visual navigation workbench</div>
        <div class="bar"></div>
    </div>
</body>
</html>
