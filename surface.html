<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Surface</title>
    <style>
        :root { color-scheme: dark; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            background: #252526;
            border-bottom: 1px solid #333;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .controls input[type="range"] { width: 110px; }

        .controls select,
        .controls button {
            background: #333;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
        }

        .controls button { cursor: pointer; }
        .controls button:hover { background: #3a3a3a; }

        .controls .spacer { flex: 1; }

        .controls button.close-btn {
            border-color: #5a3a3a;
            background: #4a2a2a;
        }

        .controls button.close-btn:hover { background: #5e3333; }

        .plot {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas.dragging { cursor: grabbing; }

        .status {
            padding: 5px 12px;
            background: #007acc;
            color: #fff;
            display: flex;
            gap: 18px;
        }
    </style>
</head>

<body>
    <div class="controls">
        <label>Detail
            <input id="grid" type="range" min="24" max="240" step="8" value="120">
            <span id="grid-value">120</span>
        </label>
        <label>Height
            <input id="height" type="range" min="0" max="120" step="1" value="40">
        </label>
        <label>Colour
            <select id="palette">
                <option value="viridis">Viridis</option>
                <option value="grayscale">Grayscale</option>
                <option value="heat">Heat</option>
            </select>
        </label>
        <label><input id="wire" type="checkbox"> Wireframe</label>
        <button id="reset">Reset view</button>
        <span>Drag to rotate, scroll to zoom, shift-drag to pan</span>
        <span class="spacer"></span>
        <button id="close" class="close-btn" title="Close this window (Esc)">Close</button>
    </div>

    <div class="plot"><canvas id="canvas"></canvas></div>

    <div class="status">
        <span id="status-name">Loading…</span>
        <span id="status-size"></span>
        <span id="status-cells"></span>
    </div>

    <script type="module">
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        const view = { yaw: -0.6, pitch: 0.95, zoom: 1, panX: 0, panY: 0 };
        const defaults = { ...view };

        let heights = null;      // Float32Array of sampled luminance, 0..1
        let gridWidth = 0;
        let gridHeight = 0;
        let source = null;       // ImageData of the decoded image

        const controls = {
            grid: document.getElementById('grid'),
            gridValue: document.getElementById('grid-value'),
            height: document.getElementById('height'),
            palette: document.getElementById('palette'),
            wire: document.getElementById('wire'),
            reset: document.getElementById('reset'),
            close: document.getElementById('close')
        };

        // Perceptual luminance, so a colour image maps to the brightness the eye sees.
        function luminance(r, g, b) {
            return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        }

        // Box-average the image down to the grid, which keeps detail that point sampling would drop.
        function sampleHeights(resolution) {
            const aspect = source.width / source.height;
            gridWidth = aspect >= 1 ? resolution : Math.max(8, Math.round(resolution * aspect));
            gridHeight = aspect >= 1 ? Math.max(8, Math.round(resolution / aspect)) : resolution;

            heights = new Float32Array(gridWidth * gridHeight);
            const data = source.data;
            for (let row = 0; row < gridHeight; row += 1) {
                const y0 = Math.floor(row * source.height / gridHeight);
                const y1 = Math.max(y0 + 1, Math.floor((row + 1) * source.height / gridHeight));
                for (let column = 0; column < gridWidth; column += 1) {
                    const x0 = Math.floor(column * source.width / gridWidth);
                    const x1 = Math.max(x0 + 1, Math.floor((column + 1) * source.width / gridWidth));
                    let total = 0;
                    let count = 0;
                    for (let y = y0; y < y1; y += 1) {
                        let index = (y * source.width + x0) * 4;
                        for (let x = x0; x < x1; x += 1, index += 4) {
                            total += luminance(data[index], data[index + 1], data[index + 2]);
                            count += 1;
                        }
                    }
                    heights[row * gridWidth + column] = total / count;
                }
            }
        }

        const PALETTES = {
            grayscale: t => [t * 255, t * 255, t * 255],
            // Coarse viridis stops, interpolated: dark blue -> teal -> green -> yellow.
            viridis: t => interpolate(t, [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]]),
            heat: t => interpolate(t, [[0, 0, 0], [128, 0, 0], [255, 100, 0], [255, 220, 60], [255, 255, 255]])
        };

        function interpolate(t, stops) {
            const scaled = Math.min(0.999, Math.max(0, t)) * (stops.length - 1);
            const index = Math.floor(scaled);
            const fraction = scaled - index;
            const a = stops[index];
            const b = stops[index + 1];
            return [a[0] + (b[0] - a[0]) * fraction, a[1] + (b[1] - a[1]) * fraction, a[2] + (b[2] - a[2]) * fraction];
        }

        // Orthographic projection: rotate about the vertical axis (yaw), then tip towards the viewer (pitch).
        function project(x, y, z, size) {
            const cosYaw = Math.cos(view.yaw);
            const sinYaw = Math.sin(view.yaw);
            const cosPitch = Math.cos(view.pitch);
            const sinPitch = Math.sin(view.pitch);

            const rx = x * cosYaw - y * sinYaw;
            const ry = x * sinYaw + y * cosYaw;

            const scale = size * 0.62 * view.zoom;
            return {
                x: rx * scale + view.panX,
                y: (ry * cosPitch - z * sinPitch) * scale + view.panY,
                depth: ry * sinPitch + z * cosPitch
            };
        }

        function render() {
            const ratio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            context.setTransform(ratio, 0, 0, ratio, 0, 0);

            context.fillStyle = '#1e1e1e';
            context.fillRect(0, 0, width, height);
            if (!heights) return;

            context.save();
            context.translate(width / 2, height / 2);

            const size = Math.min(width, height);
            const heightScale = Number(controls.height.value) / 100;
            const palette = PALETTES[controls.palette.value];
            const wireframe = controls.wire.checked;

            const points = new Array(gridWidth * gridHeight);
            for (let row = 0; row < gridHeight; row += 1) {
                for (let column = 0; column < gridWidth; column += 1) {
                    const index = row * gridWidth + column;
                    points[index] = project(
                        column / (gridWidth - 1) - 0.5,
                        row / (gridHeight - 1) - 0.5,
                        heights[index] * heightScale,
                        size);
                }
            }

            // Painter's algorithm: draw the furthest quads first so nearer ones cover them.
            const quads = [];
            for (let row = 0; row < gridHeight - 1; row += 1) {
                for (let column = 0; column < gridWidth - 1; column += 1) {
                    const a = row * gridWidth + column;
                    const b = a + 1;
                    const c = a + gridWidth + 1;
                    const d = a + gridWidth;
                    quads.push({
                        a, b, c, d,
                        depth: points[a].depth + points[b].depth + points[c].depth + points[d].depth,
                        level: (heights[a] + heights[b] + heights[c] + heights[d]) / 4
                    });
                }
            }
            quads.sort((first, second) => first.depth - second.depth);

            for (const quad of quads) {
                const pa = points[quad.a];
                const pb = points[quad.b];
                const pc = points[quad.c];
                const pd = points[quad.d];

                // Screen-space cross product approximates facing, giving cheap shading.
                const shade = 0.72 + 0.28 * Math.min(1, Math.abs(
                    (pb.x - pa.x) * (pd.y - pa.y) - (pb.y - pa.y) * (pd.x - pa.x)) / 40);
                const [r, g, b] = palette(quad.level);

                context.beginPath();
                context.moveTo(pa.x, pa.y);
                context.lineTo(pb.x, pb.y);
                context.lineTo(pc.x, pc.y);
                context.lineTo(pd.x, pd.y);
                context.closePath();

                if (wireframe) {
                    context.strokeStyle = `rgb(${r * shade} ${g * shade} ${b * shade})`;
                    context.stroke();
                } else {
                    context.fillStyle = `rgb(${r * shade} ${g * shade} ${b * shade})`;
                    context.fill();
                    // Filling the outline too hides the hairline seams between adjacent quads.
                    context.strokeStyle = context.fillStyle;
                    context.stroke();
                }
            }

            context.restore();
        }

        let frame = null;
        function scheduleRender() {
            if (frame !== null) return;
            frame = requestAnimationFrame(() => { frame = null; render(); });
        }

        // Pointer capture throws for synthetic events, so window listeners are used instead.
        let drag = null;
        canvas.addEventListener('pointerdown', event => {
            drag = { x: event.clientX, y: event.clientY, pan: event.shiftKey };
            canvas.classList.add('dragging');
        });
        window.addEventListener('pointermove', event => {
            if (!drag) return;
            const dx = event.clientX - drag.x;
            const dy = event.clientY - drag.y;
            drag.x = event.clientX;
            drag.y = event.clientY;
            if (drag.pan) {
                view.panX += dx;
                view.panY += dy;
            } else {
                view.yaw += dx * 0.01;
                view.pitch = Math.min(Math.PI / 2, Math.max(-Math.PI / 2, view.pitch + dy * 0.01));
            }
            scheduleRender();
        });
        window.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); });

        canvas.addEventListener('wheel', event => {
            event.preventDefault();
            view.zoom = Math.min(8, Math.max(0.2, view.zoom * (event.deltaY < 0 ? 1.1 : 1 / 1.1)));
            scheduleRender();
        }, { passive: false });

        controls.grid.addEventListener('input', () => {
            controls.gridValue.textContent = controls.grid.value;
            if (!source) return;
            sampleHeights(Number(controls.grid.value));
            document.getElementById('status-cells').textContent = `grid: ${gridWidth} x ${gridHeight}`;
            scheduleRender();
        });
        controls.height.addEventListener('input', scheduleRender);
        controls.palette.addEventListener('change', scheduleRender);
        controls.wire.addEventListener('change', scheduleRender);
        controls.reset.addEventListener('click', () => { Object.assign(view, defaults); scheduleRender(); });
        controls.close.addEventListener('click', () => window.close());
        window.addEventListener('keydown', event => {
            if (event.key === 'Escape') window.close();
        });
        window.addEventListener('resize', scheduleRender);

        async function start() {
            const payload = await window.surfaceView.load();
            if (!payload) {
                document.getElementById('status-name').textContent = 'No image was passed to this window';
                return;
            }

            const image = new Image();
            image.src = payload.image;
            await image.decode();

            const offscreen = document.createElement('canvas');
            offscreen.width = image.naturalWidth;
            offscreen.height = image.naturalHeight;
            const offscreenContext = offscreen.getContext('2d', { willReadFrequently: true });
            offscreenContext.drawImage(image, 0, 0);
            source = offscreenContext.getImageData(0, 0, offscreen.width, offscreen.height);

            sampleHeights(Number(controls.grid.value));
            document.getElementById('status-name').textContent = payload.name;
            document.getElementById('status-size').textContent = `${image.naturalWidth} x ${image.naturalHeight}`;
            document.getElementById('status-cells').textContent = `grid: ${gridWidth} x ${gridHeight}`;
            render();
        }

        start();
    </script>
</body>

</html>
